# wellcmsV3 for Coolify — 按容器路徑改寫的官方 nginx.conf.example
# 官方原檔所有 /www/wwwroot/wellcms 已替換為 /var/www/html（對應 Dockerfile 的 WORKDIR）
# 另補上官方範例未附的 PHP-FPM 轉發段，以及上傳大小放寬
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ⚠️ 站點根目錄必須指向 public/
    root /var/www/html/public;
    index index.php index.html;

    # 1) 視圖靜態資源（CSS/JS/圖片/字體等）
    location ^~ /views/ {
        # root = alias 路徑去掉最後一級目錄
        root /var/www/html/app;
        # 禁止直接訪問 .htm 模板（暴露頁面結構）
        location ~ \.htm$ { deny all; }
        access_log off;
        expires 30d;
    }

    # 2) 上傳檔案靜態資源
    location ^~ /upload/ {
        root /var/www/html/storage;
        # 禁止執行 PHP（防上傳目錄 RCE）
        location ~ \.php$ { deny all; }
        # 禁止直接訪問 HTML（防上傳 HTML 引發的同源 XSS）
        location ~ \.html$ { deny all; }
        access_log off;
        expires 30d;
    }

    # 3) 程式靜態資源（runtime 打包 JS/CSS 等）
    location ^~ /static/ {
        root /var/www/html/public;
        location ~ \.php$ { deny all; }
        access_log off;
        expires 30d;
    }

    # 4a) 外掛/主題 — 僅放行圖片（擴展名白名單）
    location ~ ^/(plugins|themes)/.+\.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        root /var/www/html;
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, immutable";
        access_log off;
        expires 30d;
    }

    # 4b) 外掛/主題 — 拒絕其餘所有訪問
    location ~ ^/(plugins|themes)/ {
        deny all;
        access_log off;
        return 404;
    }

    # 5) 偽靜態（三種 URL 風格：user-login.html | /user/login.html | /user/login）
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 交給本機 php-fpm（官方範例未附，此處補上）
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
